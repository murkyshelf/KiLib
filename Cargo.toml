[package]
name = "kilib"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kilib"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
notify = "6.1"
walkdir = "2.5"
zip = "2.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = "0.4"
ureq = "2.12"
